<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/(bin|config|database|docker|includes|repositories|scripts|services|tests|tools|vendor|workers)(/|$)">
        Require all denied
    </DirectoryMatch>

    <Directory /var/www/html/storage>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads/adhesions/logos>
        Require all granted
    </Directory>

    <Directory /var/www/html/uploads/etablissements/logos>
        Require all granted
    </Directory>

    <FilesMatch "(^\.|\.sql$|\.bak($|-)|^composer\.(json|lock)$|^Dockerfile$|^render\.yaml$)">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
